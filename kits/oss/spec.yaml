schemaVersion: "1"
kind: mixin
name: grafana
displayName: Grafana (self-hosted OSS)
description: "Adds the official Grafana MCP server (mcp-grafana) plus grafana-client, wired to a self-hosted Grafana. Set GRAFANA_URL/allowedDomains to your host and store the token with: sbx secret set -g grafana."
sourceURL: https://github.com/ajeetraina/sbx-kits-grafana

# This kit targets a self-hosted Grafana whose hostname only you know, so it is
# meant to be run from a local clone that you edit:  sbx run --kit ./kits/oss
# Replace grafana.example.com below with your Grafana host in all three places
# (allowedDomains, serviceDomains, and GRAFANA_URL / mcp.json).
network:
  allowedDomains:
    - pypi.org
    - files.pythonhosted.org
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - grafana.example.com
  serviceDomains:
    grafana.example.com: grafana
  serviceAuth:
    grafana:
      headerName: Authorization
      valueFormat: "Bearer %s"

environment:
  variables:
    GRAFANA_URL: "https://grafana.example.com"
    # Placeholder — the sbx proxy swaps in the real token from the stored
    # `grafana` secret on the wire, so the token never enters the sandbox.
    GRAFANA_SERVICE_ACCOUNT_TOKEN: "placeholder"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"
  proxyManaged:
    - GRAFANA_SERVICE_ACCOUNT_TOKEN

credentials:
  sources:
    grafana:
      env:
        - GRAFANA_SERVICE_ACCOUNT_TOKEN

commands:
  install:
    - command: "mkdir -p /home/agent/.local/bin && arch=$(uname -m) && case \"$arch\" in x86_64) a=x64 ;; aarch64|arm64) a=arm64 ;; *) a=x64 ;; esac && curl -fsSL \"https://github.com/grafana/mcp-grafana/releases/download/v1.0.0/linux.${a}.grafana.tar.gz\" | tar -xz -C /home/agent/.local/bin mcp-grafana && chmod +x /home/agent/.local/bin/mcp-grafana"
      user: "1000"
      description: "Download the pinned mcp-grafana v1.0.0 binary for the container arch into ~/.local/bin"
    - command: "pip install --break-system-packages 'grafana-client==5.1.0'"
      user: "1000"
      description: "Install the grafana-client Python library"
  startup:
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 && claude mcp add grafana -- /home/agent/.local/bin/mcp-grafana >/dev/null 2>&1 || true"]
      user: "1000"
      description: "Register mcp-grafana with the Claude agent (best-effort; no-op elsewhere)"
  initFiles:
    - path: /home/agent/.grafana/mcp.json
      mode: "0644"
      onlyIfMissing: true
      description: "Portable MCP server definition for a self-hosted Grafana"
      content: |
        {
          "mcpServers": {
            "grafana": {
              "command": "/home/agent/.local/bin/mcp-grafana",
              "args": [],
              "env": {
                "GRAFANA_URL": "https://grafana.example.com"
              }
            }
          }
        }
memory: |
  ## Grafana observability tooling (self-hosted)

  The official Grafana MCP server (`mcp-grafana`) is installed at
  `~/.local/bin/mcp-grafana` and wired to a self-hosted Grafana via
  `GRAFANA_URL`. The service-account token is supplied by the sbx proxy from
  the stored `grafana` secret, so it is not present in the sandbox. Through the
  MCP server you can search dashboards, list datasources, and run
  Prometheus/Loki queries. The `grafana-client` Python library is installed for
  scripting; see `~/runbooks/grafana_report.py`.
